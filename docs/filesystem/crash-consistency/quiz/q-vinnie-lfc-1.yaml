author: vinnie-lfc
date: 2026-05-26
question: |
  ext4 的 extent 可以用一筆 metadata 描述一段連續的 physical blocks；
  相比 ext2 一個 block 一個 pointer，通常能大幅減少大檔案的 metadata。
  
  但如果 extent 數量太多，ext4 仍然需要用 extent tree 來管理這些 extent。
  請問下列哪一種 workload 最可能讓 ext4 的 extent 模型退化，
  使 metadata 大小接近 ext2 的 indirect block pointer 模型？

options:
  - text: "反覆對同一個大檔案 append 4 KB，但每次 append 前都先製造 disk fragmentation，使新分配的 block 幾乎都無法和前一個 block 連續。"
    correct: true
    explanation: |
      正確。Extent 的優勢來自於一筆 extent 可以描述一段連續 physical blocks。
      如果每次 append 的 4 KB block 都被分配到不連續的位置，
      那麼每個 block 可能都需要一個 extent。
      當 extent 數量太多、inode 放不下時，ext4 會把這些 extent 放進 extent tree。
      因此 metadata 數量會隨著 data block 數量增加，變得接近 ext2 的 indirect block pointer 模型。
      
  - text: "一次性 sequential write 一個 10 GB 大檔案到空的 ext4 filesystem。"
    explanation: |
      錯。這通常是 extent 最擅長的情況。
      如果磁碟空間充足且連續，allocator 可以分配大段連續 blocks，
      少量 extent 就能描述整個檔案。

  - text: "反覆讀取同一個大檔案，使它的 data blocks 都進入 page cache。"
    explanation: |
      錯。讀取 workload 不會改變檔案在磁碟上的 block layout，
      也不會讓 extent 數量增加。Page cache 只影響讀取效能，不是 extent 模型退化的原因。

  - text: "建立很多 hard links 指向同一個大檔案。"
    explanation: |
      錯。Hard link 只是增加 directory entry 並提高 inode 的 link count。
      它不會改變檔案 data blocks 的 physical layout，
      因此不會讓 extent 模型變大。
