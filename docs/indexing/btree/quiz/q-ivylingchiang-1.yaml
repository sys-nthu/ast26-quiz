author: "ivylingchiang"
date: "2026-05-27"
question: |
  假設一個基於 **Adaptive B-Tree** 實作的生產環境資料庫儲存了大量的 URL 字串作為 Key。系統原本主要處理大量的單一網址查詢 (`Point Lookup`)，但最近一週的 Workload 發生劇烈改變，變成了以網址前綴的範圍掃描 (`Range Scan`) 為主。根據 *B-Trees Are Back* 論文的設計，系統內的 Leaf Nodes 會發生什麼動態轉變？
options:
  - text: "Leaf nodes 會大量轉變為 **Dense Leaves**，因為 `Range Scan` 需要連續的記憶體空間來提升掃描速度。"
    explanation: |
      錯誤。**Dense Leaves** 僅適用於高度密集的整數（Dense Integers），URL 字串無法使用 frame-of-reference 轉換為陣列索引，因此不可能轉為 Dense Leaves。
  - text: "Leaf nodes 會從 **Fingerprinting** 結構逐漸轉變為 **Comparison-based (Heads + Hints)** 結構，以避免掃描時頻繁的 *Lazy Sort* 開銷。"
    correct: true
    explanation: |
      正確。對於 URL 這種 Key，`Point Lookup` 時系統傾向使用 **Fingerprinting** 搭配 SIMD 加速。但當 Workload 轉為 `Range Scan`，未排序的 Fingerprinting 佈局需要付出高昂的 *Lazy Sort* 代價。透過 1-byte saturating counter 的 *operation-adaption* 機制，Leaf 會自動偵測並轉為維持排序、適合掃描的 **Comparison-based** 結構。
  - text: "系統會將所有的 URL Key 提取前 4 bytes 放入 Slots 中，並且強行維持 **Fingerprinting** 佈局，因為 SIMD 掃描效能永遠優於 Binary Search。"
    explanation: |
      錯誤。**Fingerprinting** 的強項在於 `Point Lookup`，它的資料是未排序的（Append-only）。當遇到 `Range Scan` 時，未排序的佈局會導致營運上的效能瓶頸，系統會透過機制轉換佈局，而不會強行維持。
  - text: "Leaf nodes 的結構不會發生任何改變，因為 URL 的前綴（如 `http`）重複率太高，會直接導致 *key-adaption* 機制失效。"
    explanation: |
      錯誤。雖然 URL 前綴重複率高會影響 *key-adaption* 的決策，但 Adaptive B-Tree 同時具備 *operation-adaption*（根據操作類型更新計數器）。當 Workload 徹底改變為 `Range Scan` 時，操作計數器依然會觸發結構轉換。
