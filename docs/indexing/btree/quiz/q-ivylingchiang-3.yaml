author: "ivylingchiang"
question: |
  **Wormhole** 擁有優秀的 $O(\log L)$ 漸進複雜度（$L$ 為 Key 長度），但在資料庫系統的 Buffer Pool 耗盡（**Out-of-Memory**，資料必須 Spill 到 SSD）的場景下，其吞吐量崩潰的速度遠快於優化過的 B-Tree。造成此效能差異的最核心系統架觀原因是什麼？
options:
  A:
    text: "Wormhole 在執行 Hash 計算時會消耗大量的 CPU 週期，導致當作業系統發生儲存裝置 I/O 阻塞時，CPU 無法有效進行 Context Switch。"
    explanation: "錯誤。Wormhole 的核心瓶頸不在於 Hash 的 CPU 開銷，而在於其記憶體結構無法與外存儲存裝置（SSD）進行有效率的頁面交換。"
  B:
    text: "Wormhole 的核心索引（MetaTrieHT）是一個龐大的 Hash Table，無法輕易切分成固定大小的 **4KB Page**，且內部大量虛擬記憶體指標（Pointers）在寫入 SSD 再讀回後會直接失效。"
    explanation: "正確。B-Tree 天然是以固定大小 Page 為單位的結構，能與資料庫的 Buffer Manager 或 OS Page Cache 完美協調。而 Wormhole 與 ART 等純 In-Memory 結構屬於 Pointer-heavy 佈局，未對齊 4KB 頁面，且極度依賴虛擬記憶體位址，因此在 OOM 換頁場景下會引發架構性的崩潰。"
  C:
    text: "因為 Adaptive B-Tree 在發生 Out-of-Memory 時會強制啟動 **Dense Leaves** 機制來壓縮節點空間，而 Wormhole 完全不支援任何資料壓縮。"
    explanation: "錯誤。B-Tree 是否啟動 Dense Leaves 取決於 Key 本身的密集度（例如連續整數 ID），與系統是否進入 Out-of-Memory 狀態無關。"
  D:
    text: "因為 Wormhole 內部採用 $O(\log L)$ 搜尋，當資料量超越記憶體限制時，字串長度 $L$ 會無限制增長，導致 SSD 的隨機讀取次數呈線性暴增。"
    explanation: "錯誤。字串長度 $L$ 屬於 Key 自身的屬性，不會因為整體資料量大於 Buffer Pool 就無限制增長。Wormhole 失敗是因為其指標密集的雜亂佈局無法有效進行磁碟 Page 交換。"
answer: "B"