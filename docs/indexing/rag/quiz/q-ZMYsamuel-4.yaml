author: ZMYsamuel
date: 2026-05-25
question: |
  一個 RAG 團隊要為 6000 萬筆 768 維 float32 文字 chunk embedding（原始 vector 約 180 GB）建立向量索引。
  硬體：256 GB RAM；需求：p99 latency < 30 ms、recall@10 ≥ 90%。
  在相同硬體上對兩種純索引（不使用 PQ）做基準測試，皆達到 recall@10 ≈ 92%：

  | 索引 | p99 latency | 額外記憶體（除原始 vector 外） |
  |---|---|---|
  | HNSW（M=32, efSearch=200） | 10 ms | +15 GB（graph edges） |
  | IVF（C=7700, nprobe=50） | 65 ms | +0.06 GB（cluster centroid） |

  工程師 A 主張：「IVF 省記憶體又簡單，只要把 `nprobe` 從 50 降到 10，就能把 latency 拉進 30 ms 目標，HNSW 完全不必考慮。」

  下列何者最準確分析這個決策？
options:
  - text: "A 的建議不成立。降低 `nprobe` 確實能加速 IVF，但搜尋覆蓋率會從 $50/7700 \\approx 0.65\\%$ 等比例降至 $10/7700 \\approx 0.13\\%$，recall 將跌破 90% 目標。HNSW 額外 15 GB 在 256 GB 預算內負擔輕微，卻能換來 8 ms 的 latency 提供 3 倍以上裕度，是符合 SLA 的合理選擇。"
    correct: true
    explanation: |
      IVF 的 recall 高度依賴 $\text{nprobe}/C$ 決定的搜尋覆蓋率。
      benchmark 的 92% recall 是在 `nprobe=50` 下測得，把 nprobe 降至 10 後覆蓋率縮小 5 倍，
      真實近鄰落在未掃描 cluster 中的機率大幅上升，recall 必然下降至無法滿足 90% 門檻。
      HNSW 的 O($\log N$) 在 60M 規模下只需 ~20 次距離計算，相較於 IVF 的 O($\sqrt{N}$) ~7700 × nprobe 次有壓倒性優勢。
      在記憶體充裕的情境下，多花 15 GB 換取 latency 與 recall 雙達標，是工程上正確的取捨。
  - text: "A 的建議成立。`nprobe = 10` 時 IVF 的搜尋邏輯近似 HNSW 上層的 greedy search，因此 recall 可以維持在 90% 以上，同時記憶體比 HNSW 省下 250 倍。"
    explanation: |
      IVF 與 HNSW 的搜尋邏輯本質不同：IVF 是「在被選中的 cluster 內做 brute-force 比對」，
      HNSW 是「在多層圖上跳轉」。即便 nprobe 降低，IVF 也不會「變成」HNSW 的搜尋型態。
      降 nprobe 純粹縮小搜尋範圍，與 HNSW 的 greedy 機制沒有等價關係，更不能用「省記憶體」推斷 recall 不下降。
  - text: "A 的建議結論成立但理由錯誤。IVF 的 latency 主要來自 coarse quantizer 計算 query 與所有 $C=7700$ 個 centroid 的距離，與 nprobe 數量無關，因此降低 nprobe 並無加速效果。"
    explanation: |
      coarse quantizer 的成本只佔總 latency 的小部分（7700 次距離計算），
      真正的成本來自掃描 nprobe 個 inverted list 內所有 vector 的距離計算（數量級遠大於 coarse quantizer）。
      因此降低 nprobe **確實**會顯著加速查詢，這部分推理本身沒錯；
      問題在於這個加速會以 recall 為代價，而非 nprobe 不影響 latency。
  - text: "A 的建議成立且為最佳選擇。HNSW 的 graph 在 60M 規模下會因為隨機記憶體存取產生嚴重 cache miss，實測 latency 通常比 benchmark 結果高 5–10 倍，10 ms 的數字並不可信。"
    explanation: |
      HNSW 的 cache 不友善是真實存在的議題，但這個因素已經反映在題目給定的 benchmark 結果中——
      10 ms 是「實測」p99，不是理論值。任意把已測值再乘上 5–10 倍當作真實效能來推翻決策，
      在工程上是不合理的推論方式。
