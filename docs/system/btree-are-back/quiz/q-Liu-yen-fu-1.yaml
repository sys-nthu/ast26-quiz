author: Liu-yen-fu
date: 2026-05-28
question: |
  下列哪個敘述最能體現 BAB 論文的核心貢獻？
options:
  - text: "資料結構的實際效能取決於其與現代硬體的契合度"
    correct: true
    explanation: |
      記憶體存取延遲與 Cache Miss 次數才是系統效能的關鍵成本，而非理論上的漸近複雜度，因此資料結構必須透過優化 layout 來契合 CPU 的 Cache Line 使用效率與 Hardware Prefetcher
  - text: "Big-O 仍然是衡量資料結構效能的唯一標準。"
    explanation: |
      在面對 dense integer 時，優化後的 B-Tree 在 lookup throughput 上超越了理論上複雜度較優的 Wormhole ，顯示 Big-O 不是唯一標準。
  - text: "Wormhole 由於採用緊湊的 MetaTrieHT 結構，其空間利用率極高，幾乎 100% 用於存放 key-value 。"
    explanation: |
      Wormhole 雖然索引結構本身很小，但 record 都是分散 malloc 的，memory allocator overhead 大概佔了 1/3 空間
  - text: "Adaptive B-Tree 的 leaf layout 會動態調整，因此表現不如傳統單一固定 layout 的 B-Tree 。"
    explanation: |
      Adaptive B-Tree 能調整至當前 workload 下的最佳 layout ，表現與手動固定為最佳 layout 的 B-Tree 只差 2%
