author: lunnn17
date: 2026-05-28
question: |
  在 BAB 論文中，adaptive B-tree 能夠根據資料型態與操作負載動態切換三種 leaf node layout：comparison-based (heads + hints)、fingerprinting、以及 dense leaf。

  假設你正在開發一個電子商務系統，並使用支援 BAB 優化的資料庫。系統中有以下三個資料表與對應的工作負載：
  1. `Users` 表：primary key 是系統自動產生的連續整數（user ID），主要操作為高頻率的 point lookup。
  2. `WebLogs` 表：primary key 是網址字串（幾乎所有資料都以 `https://www.nthu.com/` 開頭），主要操作為大量的資料 insert 與 point lookup。
  3. `Orders` 表：primary key 是訂單建立時間，每天半夜系統會執行大量的 range scan 來撈取特定日期的所有訂單產出報表。

  請問系統在長期運行後，最有可能會將這三個表的 leaf node 分別變形成哪一種佈局？
options:
  - text: "`Users`：dense leaves；`WebLogs`：fingerprinting；`Orders`：comparison-based"
    correct: true
    explanation: |
      `Users`：存的是連續整數，符合「足夠密集的整數」，系統會依據 key-adaption 轉換為 dense leaf，直接把 key 當陣列索引，連 key 都不用存，lookup 速度最快。
      `WebLogs`：存的是長網址，因為開頭幾乎一模一樣，如果用 heads 優化（只看前 4 bytes）會完全失去區分能力。加上主要操作是 insert/point lookup，系統會轉為 fingerprinting，放棄排序直接 append，並用 1-byte hash + SIMD 掃描來加速。
      `Orders`：因為需要頻繁執行 range scan，如果用 fingerprinting 會導致每次掃描都要執行昂貴的 lazy sort。因此系統會依據 operation-adaption 維持在 comparison-based，保持資料嚴格排序。
  - text: "`Users`：fingerprinting；`WebLogs`：comparison-based；`Orders`：dense leaves"
    explanation: |
      `Users` 的連續整數是最適合 dense leaf 的場景，若改用 fingerprinting 反而沒有發揮不存 Key 的優勢。
      對 `WebLogs` (大量相同開頭的 URL）使用 comparison-based 佈局是極糟的選擇，因為 URL 的 prefix 相似度極高，4 bytes 的 head 優化會失效，導致頻繁的 cache miss 去存取 heap 區。
  - text: "`Users`：Dense Leaves；`WebLogs`：Comparison-based；`Orders`：Fingerprinting"
    explanation: |
      `Orders` 使用 fingerprinting 的最大缺點就是不維持 sorted key。
      雖然它對 point lookup 與 insert 非常快，但如果遇到像 `Orders` 表這種需要大量 range scan 的情境，它必須在執行當下做 lazy sort，這會造成巨大的效能瓶頸。
  - text: "因為它們都是同一棵 B+ tree 的變體，為了確保底層 indexing 的一致性與正確性，這三個表最終都會統一收斂成 comparison-based layout。"
    explanation: |
      這違反了 BAB 論文 adaptive 的精神。傳統 B+ tree 確實要求所有的 leaf 都要長得一模一樣且保持排序，但這篇論文提出：同一棵樹裡的不同 leaf 應該根據自身的資料分佈與操作頻率，各自決定動態切換成最適合自己的佈局。