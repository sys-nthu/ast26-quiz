author: xian6060
date: 2026-05-25
question: |
  當我們使用無失真壓縮演算法處理下列哪一種資料時，有可能因為演算法本身的 Header 或 Metadata 開銷，導致壓縮後的檔案比原檔案還要大？
options:
  - text: "經過 Base64 格式編碼處理的原始二進位執行檔"
    explanation: |
      Base64 編碼是將每 3 個 Byte 的二進位資料擴展成 4 個 Byte 的可見字元。這個過程增加了高達 33% 的資料冗餘，因此進行無失真壓縮時，可以把這些冗餘消除，壓縮率佳。
  - text: "使用 AES-256-GCM 演算法加密後的資料庫備份檔"
    correct: true
    explanation: |
      資料壓縮的本質是「消除資料中的規律性」。加密演算法為了防止密碼分析，會將原始資料轉換成與純隨機雜訊無異的密文。加密後資料內部不太可能存在重複的位元組模式可供壓縮演算法利用。
      壓縮演算法找不到規律來縮減資料，資料本體的大小不會改變。但是，壓縮軟體依然會在檔案頭部寫入檔案結構、壓縮字典描述或校驗碼。
- text: "未經降噪處理，但包含很多相同背景的 RAW 格式天文影像"
    explanation: |
      「大量相同背景」代表資料中存在高「空間冗餘」。即使只有簡單的編碼，也能將大量相同的像素壓縮成短短幾個 Byte 的標記。
  - text: "百萬筆帶有各自獨立 Timestamp 與流水號的 JSON 格式系統日誌"
    explanation: |
      儘管時間和流水號在變，但 JSON 格式本身包含了大量的結構字元。
      對 LZ77 演算法來說，這些反覆出現的「鍵值名稱」就是極大的冗餘。Deflate 會把這些重複的模板抽離成極短的指標，壓縮率通常高達 80%~90%。
